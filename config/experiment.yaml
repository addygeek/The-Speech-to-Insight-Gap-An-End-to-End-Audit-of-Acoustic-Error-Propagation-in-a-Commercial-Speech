project:
  name: speech-to-insight-gap
  random_seed: 42

run:
  dry_run: true
  resume: true
  pilot_utterances: 25
  full_utterances: 600

dataset:
  generation_mode: hybrid
  llm_provider: openrouter
  llm_model: openai/gpt-4o-mini
  min_words: 25
  max_words: 40
  target_unique_minutes: 75
  scenario_weights:
    customer_support: 0.15
    appointment_scheduling: 0.12
    travel_booking: 0.12
    banking_payments: 0.12
    delivery_tracking: 0.12
    technical_support: 0.12
    complaints_compliments: 0.12
    requests_cancellations: 0.13

paths:
  references_jsonl: data/references.jsonl
  manifest_csv: data/manifest.csv
  audio_dir: data/audio
  results_dir: results
  figures_dir: figures
  tables_dir: tables

text_normalization:
  lowercase: true
  remove_punctuation: true
  collapse_whitespace: true
  normalize_numbers: false

audio:
  tts:
    model: aura-2-asteria-en
    encoding: linear16
    sample_rate: 24000
  perturbation:
    noise_source: generated_pink
    mild_snr_db: 15
    strong_snr_db: 8
    seed: 42

deepgram:
  listen:
    model: nova-3
    language: en
    smart_format: true
    sentiment: true
    intents: true
    topics: true
  read:
    sentiment: true
    intents: true
    topics: true
  # Secondary only. Leave off until the 25-utterance pilot is cheap.
  keyterm:
    enabled: false
    subset_size: 150
    condition: strong
  repeat:
    enabled: false
    subset_size: 40
    condition: clean

budget:
  max_usd: 40.0
  absolute_ceiling_usd: 50.0
  hard_stop: false
  pricing_estimates:
    aura_per_1k_chars: 0.03
    nova3_per_minute: 0.0043
    keyterm_per_minute: 0.0013
    read_per_request: 0.0

intent_normalization:
  synonym_map:
    cancel order: cancellation
    cancel my order: cancellation
    book appointment: scheduling
    schedule appointment: scheduling

statistics:
  bootstrap_samples: 2000
  exploratory_min_utterances: 30
  alpha: 0.05
